<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Créditos</title>
    <!-- Cargar jQuery y Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Cargar Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- Cargar script del simulador -->
    <script src="js/simulador.js" defer></script>
    <style>
        .toggle-container {
            margin-bottom: 10px;
        }
        .form-check {
            display: inline-block;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Simulador de Créditos</h1>
        <form id="creditForm" class="my-4">
            <div class="form-group">
                <label for="loanAmount">Monto del crédito:</label>
                <input type="number" id="loanAmount" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="interestRateOptions">Selecciona una tasa de interés:</label>
                <select id="interestRateOptions" class="form-control" required>
                    <option value="">Selecciona una opción</option>
                    <option value="1.5">Tasa Baja - 1.5%</option>
                    <option value="3.0">Tasa Media - 3.0%</option>
                    <option value="4.5">Tasa Alta - 4.5%</option>
                </select>
            </div>

            <div class="form-group">
                <label for="loanTerm">Plazo:</label>
                <input type="number" id="loanTerm" class="form-control" required>
                <div class="toggle-container">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="plazoMeses" name="plazoUnit" value="meses" checked>
                        <label class="form-check-label" for="plazoMeses">Meses</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="plazoDias" name="plazoUnit" value="días">
                        <label class="form-check-label" for="plazoDias">Días</label>
                    </div>
                </div>
                <small class="form-text text-muted">Selecciona el plazo en días o meses.</small>
            </div>

            <button type="submit" class="btn btn-primary">Simular</button>
        </form>

        <div id="result"></div>
        <div id="paymentResult"></div>
        <canvas id="paymentChart" width="400" height="200"></canvas>
    </div>
</body>
</html>
